<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark light">
    <title>404 · Vesty</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('svedocs-theme') || 'system'; } catch {}
        const media = matchMedia('(prefers-color-scheme: dark)');
        const apply = () => {
          const dark = preference === 'dark' || (preference !== 'light' && media.matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        };
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
    <style>
      :root { --bg: #f5f7f8; --ink: #18252d; --muted: #56656d; --accent: #306b26; --line: #d6dfe2; }
      :root[data-theme="dark"] { --bg: #090d14; --ink: #edf2f8; --muted: #9aa8bb; --accent: #a3f77b; --line: #263244; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --bg: #090d14; --ink: #edf2f8; --muted: #9aa8bb; --accent: #a3f77b; --line: #263244; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.7 ui-monospace, monospace; }
      main { max-width: 42rem; padding: 2rem; }
      h1 { font: 600 clamp(28px, 6vw, 40px)/1.2 system-ui, sans-serif; letter-spacing: -.04em; margin: 2rem 0; }
      p { color: var(--muted); }
      a { color: var(--accent); text-underline-offset: .25em; }
      nav { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <a href="/" aria-label="Vesty home">vesty</a>
      <h1>404 / Page not found</h1>
      <p>This page may have moved. Continue in the documentation.</p>
      <p lang="zh-CN">页面不存在或已移动，请从文档入口继续浏览。</p>
      <nav aria-label="Documentation"><a href="/docs/quick-start">English docs</a><a href="/docs/zh/quick-start" lang="zh-CN">中文文档</a></nav>
    </main>
  </body>
</html>
